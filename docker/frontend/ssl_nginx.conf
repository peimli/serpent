server {
  listen 80;
  server_name reapersurge.ddns.net;
  location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
  return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name reapersurge.ddns.net;

    ssl_certificate /etc/letsencrypt/live/reapersurge.ddns.net/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/reapersurge.ddns.net/privkey.pem;
location / {
    root /usr/share/nginx/serpent;
    index index.html;
  }
  location /save-score {
    proxy_pass http://backend:3000/save-score;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "*";
  }
  location /top-scores {
    proxy_pass http://backend:3000/top-scores;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "*";
  }

}
